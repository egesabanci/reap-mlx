[project]
name = "reap-mlx"
version = "0.1.0"
description = "REAP pruning for MLX-LM MoE models."
readme = "README.md"
authors = [
    { name = "Ege Sabanci", email = "egesabanci@outlook.com.tr" },
]
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=3.6.0,<4.0.0",
    "huggingface-hub>=1.0.0,<2.0.0",
    "mlx>=0.31.0,<0.32.0",
    "mlx-lm>=0.31.1,<0.32.0",
    "numpy>=1.26",
    "safetensors>=0.5",
    "transformers>=5.0.0,<6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reap"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[project.urls]
Repository = "https://github.com/egesabanci/reap-mlx"

[tool.ruff]
line-length = 88
select = ["SIM"]
