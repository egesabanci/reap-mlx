name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  conventional-pr-title:
    name: conventional-pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}

    steps:
      - name: Validate conventional PR title
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits."
            echo "Examples:"
            echo "  feat(mlx): add new model adapter"
            echo "  fix: handle mlx-lm loader compatibility"
            echo "  docs: update calibration guide"
            echo
            echo "Actual title: $PR_TITLE"
            exit 1
          fi
