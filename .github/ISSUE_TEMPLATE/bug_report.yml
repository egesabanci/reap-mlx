name: Bug report
description: Report a reproducible issue in REAP MLX.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, model, dataset, pruning settings, and any local changes.
      placeholder: |
        uv run python -m reap.entrypoint ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or metrics
      description: Paste the relevant error, traceback, or validation-metrics excerpt.
      render: text
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS version, Apple Silicon chip, Python version"
  - type: input
    id: versions
    attributes:
      label: Package versions
      placeholder: "mlx, mlx-lm, transformers, reap-mlx"
